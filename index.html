<style>

<script>
const $=s=>document.querySelector(s);
const on=i=>$('#'+i)&&$('#'+i).classList.add('on');

<g id="p-ribo" fill="#2c3e50">${[[470,300],[490,318],[510,296],[530,325],[480,335],[690,200],[660,350],[560,170]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6"/>`).join('')}</g>`

const tx=(id,y,t,fs=22,c='#222')=>`<text class="lbl" id="${id}" x="640" y="${y}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${c}">${t}</text>`;
const SC=[
{b:()=>`<g id="a" class="f"><text x="640" y="270" font-size="150" text-anchor="middle">🌍</text><text x="480" y="150" font-size="64">🧍</text><text x="760" y="160" font-size="64">🐕</text><text x="540" y="400" font-size="64">🌿</text><text x="740" y="390" font-size="64">🐦</text>${cap('الكائنات الحية')}</g><g id="b" class="f" style="opacity:0"><text x="640" y="340" font-size="230" text-anchor="middle">🍃</text>${cap('ورقة نبات')}</g><g id="c" class="f" style="opacity:0">${tissue()}${cap('نسيج')}</g><g id="d" class="f" style="opacity:0">${plant(0)}${cap('خلية واحدة')}</g>`,
 st:[[0,()=>only('a')],[6,()=>only('b')],[10.5,()=>only('c')],[15,()=>only('d')]],
 say:'هل تعلم أن أجسام الكائنات الحية، على اختلاف أشكالها وأحجامها، تتكون من وحدات صغيرة جدًا تُسمى الخلايا؟ هيا نتعرف على هذه الوحدة المدهشة التي تُعد أساس الحياة.'},
{b:()=>`${cap('الخلية: أصغر وحدة بنائية ووظيفية')}<g transform="translate(480,265) scale(.55) translate(-620,-270)">${animal(0)}</g>${tx('r1',190,'🦠 كائنات من خلية واحدة',22)}${tx('r2',260,'🧍🌿 كائنات من خلايا متخصصة',22)}${tx('r3',335,'💪 حركة · 🩸 نقل المواد · 🌱 نمو',22,'#1d4e89')}`.replace(/x="640" y="(190|260|335)"/g,'x="775" y="$1"'),
 st:[[8,()=>on('r1')],[12,()=>on('r2')],[18,()=>on('r3')]],
 say:'الخلية هي أصغر وحدة بنائية ووظيفية في الكائن الحي. وتختلف الخلايا في أشكالها وأحجامها ووظائفها؛ فبعضها يساعد على الحركة، وبعضها ينقل المواد، وبعضها يساهم في النمو.'},
{b:()=>`<text x="860" y="60" text-anchor="middle" font-size="24" font-weight="800" fill="#e0457b">الخلية الحيوانية</text>${animal(1)}`,
 st:[[2,()=>reveal('mem')],[12,()=>reveal('cyt')],[21,()=>reveal('nuc')],[31,()=>reveal('mito')],[41,()=>reveal('ribo')]],
 say:'لنبدأ بالخلية الحيوانية. الغشاء الخلوي ينظم دخول المواد إلى الخلية وخروجها. السيتوبلازم مادة هلامية توجد فيها العضيات، وتحدث فيها تفاعلات حيوية عديدة. النواة تحتوي على معظم المادة الوراثية، وتنظم أنشطة الخلية. الميتوكوندريا تنتج معظم الطاقة التي تحتاجها الخلية. والريبوسومات تصنع البروتينات.'},
{b:()=>`<text x="440" y="62" text-anchor="middle" font-size="24" font-weight="800" fill="#2f7d32">الخلية النباتية</text>${plant(1)}<g class="lbl" id="sun"><text x="890" y="100" font-size="58" text-anchor="middle">☀️</text><line x1="868" y1="112" x2="672" y2="164" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ar)"/></g>${tx('eq',433,'ضوء الشمس + ماء + ثاني أكسيد الكربون = غذاء + أكسجين',19,'#1d7a2c')}`,
 st:[[7,()=>reveal('wall')],[14,()=>{reveal('chl');on('sun')}],[22,()=>on('eq')],[30,()=>reveal('vac')]],
 say:'الخلية النباتية تشترك مع الخلية الحيوانية في الغشاء الخلوي والسيتوبلازم والنواة، وتتميز بثلاثة أجزاء. الجدار الخلوي يوفر الدعم والحماية ويحافظ على شكل الخلية. البلاستيدات الخضراء تحتوي على الكلوروفيل، وتستقبل ضوء الشمس لتصنع الغذاء بالبناء الضوئي. أما الفجوة العصارية الكبيرة فتخزن الماء ومواد أخرى، وتحافظ على ضغط الخلية.'},
{b:()=>table(),st:[[0.5,()=>on('t0')],[2,()=>on('t1')],[4,()=>on('t2')],[6,()=>on('t3')],[8,()=>on('t4')],[13,()=>on('t5')],[16,()=>on('t6')],[19,()=>on('t7')]],
 say:'عند المقارنة، تشترك الخليتان في الغشاء الخلوي والسيتوبلازم والنواة والعضيات. وتتميز الخلية النباتية عادةً بوجود جدار خلوي وبلاستيدات خضراء وفجوة عصارية كبيرة.'},
{b:()=>`${cap('🧠 اختبر نفسك')}${tx('q1',125,'١) ما الجزء الذي ينظم دخول المواد إلى الخلية وخروجها؟',20)}${tx('a1',165,'الغشاء الخلوي ✔',26,'#1a9a46')}${tx('q2',225,'٢) ما الجزء الذي يساعد الخلية النباتية على البناء الضوئي؟',20)}${tx('a2',265,'البلاستيدات الخضراء ✔',26,'#1a9a46')}${tx('th',340,'⏳ فكّر قليلًا...',30,'#d97706')}${tx('f1',345,'الخلية وحدة صغيرة، لكنها أساس بناء',27,'#1d4e89')}${tx('f2',390,'الكائنات الحية واستمرار الحياة',27,'#1d4e89')}`,
 st:[[1,()=>on('q1')],[4,()=>on('q2')],[8,()=>on('th')],[11.5,()=>{off('th');on('a1')}],[13,()=>on('a2')],[15.5,()=>{on('f1');on('f2')}]],
 say:'والآن اختبر نفسك. ما الجزء الذي ينظم دخول المواد إلى الخلية وخروجها؟ وما الجزء الذي يساعد الخلية النباتية على القيام بعملية البناء الضوئي؟ فكّر قليلًا. الإجابة: الغشاء الخلوي، والبلاستيدات الخضراء. الخلية وحدة صغيرة، لكنها أساس بناء الكائنات الحية واستمرار الحياة.'}

const D=[20,25,50,40,25,20],S=[];let a=0;D.forEach(d=>{S.push(a);a+=d});
let begin,raf,cur=-1,fired=[],sents=[],muted=false;
function speak(t){if(muted||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.88;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ar'));if(v)u.voice=v;speechSynthesis.speak(u)}
function enter(i){cur=i;fired=[];$('#board').innerHTML=SC[i].b();const p=SC[i].say.split(/(?<=[.؟])\s*/).filter(Boolean),tot=p.reduce((n,s)=>n+s.length,0);let c=0;sents=p.map(s=>{const st=c/tot*D[i]*.88;c+=s.length;return[st,s]});speak(SC[i].say)}
function loop(now){const t=(now-begin)/1000;if(t>=180){end();return}
let i=0;while(i<5&&t>=S[i+1])i++;if(i!==cur)enter(i);const s=t-S[i];
SC[i].st.forEach(([x,f],k)=>{if(!fired[k]&&s>=x){fired[k]=1;f()}});
let cs='';sents.forEach(([x,z])=>{if(s>=x)cs=z});$('#sub').textContent=cs;$('#sub').style.opacity=s<D[i]*.95?1:0;

$('#bar').style.width=t/1.8+'%';raf=requestAnimationFrame(loop)}
function start(){$('#ov').style.display='none';cur=-1;begin=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}

{st:[[0,()=>only('a')],[4,()=>only('b')],[7.5,()=>only('c')],[10.5,()=>only('d')]],
